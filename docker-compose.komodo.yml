# Komodo Stack definition — single, generic image; config and brand assets
# are mounted at runtime from the Stack's Run Directory instead of baked into
# the image. This lets config.yml be added as a Komodo "Config File" and
# edited straight from the Komodo UI, with just a restart (no rebuild) to
# apply changes.
#
# Run Directory on the host must contain:
#   config.yml   — add under the Stack's Config Files to edit it in the UI
#                  (seed it from clients/<name>/config.yml)
#   brands/      — logo, favicons, etc. Binary files aren't editable through
#                  the Config Files text editor — upload/replace them on the
#                  host directly (seed from clients/<name>/public/), then
#                  restart the stack to pick up changes.
services:
  app:
    build:
      context: .
      target: app
    image: intebec/docuseal:latest
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - docuseal_data:/data/docuseal
      - ./config.yml:/run/secrets/config.yml:ro
      - ./brands:/app/public/brands:ro
    environment:
      - FORCE_SSL=${FORCE_SSL:-true}
      - INTEBEC_CONFIG_PATH=/run/secrets/config.yml

volumes:
  docuseal_data:
