# Komodo Stack definition for a single-client, self-contained deployment.
#
# Unlike docker-compose.yml (which mounts config.yml/brands from a sibling
# intebec-whitelabel checkout for local/dev use), this builds one image with
# the client's white-label config and brand assets baked in via the Dockerfile
# "client" stage. Only the app repo is needed — no second repo, no runtime
# secret files to manage on the target host.
#
# Set INTEBEC_CLIENT in the Stack's environment to pick the client
# (defaults to "parcours"); clients/<name>/ must exist in this repo.
services:
  app:
    build:
      context: .
      target: client
      args:
        CLIENT: ${INTEBEC_CLIENT:-parcours}
    image: intebec/docuseal:${INTEBEC_CLIENT:-parcours}
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - docuseal_data:/data/docuseal
    environment:
      - FORCE_SSL=${FORCE_SSL:-true}

volumes:
  docuseal_data:
