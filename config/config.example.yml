# =============================================================================
# Intebec DocuSeal — white-label config TEMPLATE
# =============================================================================
# Client configs live in the private intebec-whitelabel repo (checked out
# side by side with this app). To create a new client, copy this template
# there and switch to it:
#
#   cp config/config.example.yml ../intebec-whitelabel/clients/acme.yml
#   cd ../intebec-whitelabel
#   bash bin/use-client ../intebec-docuseal acme   # writes config/config.yml,
#                                                  # public/brands/acme and .env
#
# One-off without switching (dev):
#   INTEBEC_CLIENT=acme INTEBEC_CLIENTS_DIR=../intebec-whitelabel/clients bin/rails server
#
# config/config.yml, config/clients/ and public/brands/ are gitignored, so
# client branding never lands in this public repo.
#
# Every key below is OPTIONAL — anything you omit falls back to a safe default
# (see lib/whitelabel.rb). The values here are an illustrative example.
# =============================================================================

brand:
  name: "Parcours"
  short_name: "Parcours"
  tagline: "Signature"
  description: "Outil de signature numérique de Parcours."
  page_title_signed_in: "Parcours Signature"
  page_title_signed_out: "Parcours | Signature"

urls:
  website: "https://monparcours.ca"
  support_email: "info@intebec.ca"
  privacy_policy: null
  terms_of_service: null
  twitter_url: null
  twitter_handle: null
  github_url: null
  discord_url: null

email:
  from_name: "Parcours"
  from_address: "direction@monparcours.ca"
  attribution_html: 'Envoyé avec <a href="%{website}">%{brand}</a>.'

assets:
  logo_path: "/brands/logo.svg"
  logo_width: 137
  logo_height: 137
  favicon_svg: "/brands/favicon.svg"
  favicon_ico: "/brands/favicon.ico"
  favicon_16: "/brands/favicon-16x16.png"
  favicon_32: "/brands/favicon-32x32.png"
  favicon_96: "/brands/favicon-96x96.png"
  apple_touch_icon: "/brands/apple-icon-180x180.png"
  preview_image: "/brands/logo.svg"
  # Optional per-client stylesheet, loaded after the base theme (overrides
  # anything). Usually you DON'T set this: drop a custom.css next to the logo
  # in the client's brand directory and it is picked up automatically.
  # custom_css: "/brands/custom.css"

theme:
  primary: "205 68% 32%"
  primary_focus: "205 69% 26%"
  primary_content: "0 0% 100%"
  secondary: "184 61% 43%"
  secondary_focus: "184 62% 35%"
  secondary_content: "0 0% 100%"
  accent: "25 79% 57%"
  accent_focus: "25 69% 49%"
  accent_content: "220 14% 10%"
  neutral: "220 16% 12%"
  neutral_focus: "220 16% 8%"
  neutral_content: "0 0% 100%"
  base_100: "0 0% 100%"
  base_200: "206 47% 97%"
  base_300: "204 63% 94%"
  base_content: "220 14% 10%"
  info: "205 80% 50%"
  success: "154 55% 38%"
  warning: "38 88% 48%"
  error: "0 72% 50%"
  rounded_btn: "1.9rem"
  tab_border: "2px"
  tab_radius: ".5rem"

pdf:
  sign_reason: "Signé par %{name} avec Parcours"
  audit_trail_footer: "Signé avec Parcours"
  creator: "Parcours"
  cert_name: "Parcours Self-Host Autogenerated"

pwa:
  description: "Parcours est une plateforme sécurisée pour la signature et le traitement des documents."
  theme_color: "#F4F8FB"
  background_color: "#F4F8FB"

webhooks:
  user_agent: "Parcours Webhook"

features:
  show_github_button: false
  show_powered_by: true
  powered_by_text: "Parcours"
  show_ai_link: false
  show_discord_link: false
  show_pro_upsells: false

internal:
  temp_email_domain: "monparcours.ca"

locale:
  default: "fr-FR"
  available:
    - "fr"
    - "fr-FR"
    - "fr-CA"
    - "en"
    - "en-US"
  fallback: "fr-FR"
  time_zone: "America/Toronto"

styling:
  css_variables:
    ib-bg: "206 47% 97%"
    ib-surface: "0 0% 100%"
    ib-surface-2: "204 63% 94%"
    ib-border: "220 13% 84%"
    ib-text: "220 14% 10%"
    ib-text-secondary: "220 10% 46%"
    ib-muted: "220 8% 60%"

text:
  translations:
    fr-FR:
      sign_in: "Connexion"
      sign_out: "Déconnexion"
      settings: "Paramètres"
      onboarding.support_description: "Nous écrire à info@intebec.ca si vous avez des questions."
    en-US: {}

# Roles & permissions — customise per client.
# First role in the list is considered the "admin" role.
# Actions: read, create, update, delete
# Resources: templates, submissions, users, settings
roles:
  admin:
    permissions:
      templates: [read, create, update, delete]
      submissions: [read, create, update, delete]
      users: [read, create, update, delete]
      settings: [read, create, update, delete]
    settings_sections: [account, email, storage, notifications, esign, personalization, users, api, webhooks]
  gestionnaire:
    permissions:
      templates: [read, create, update, delete]
      submissions: [read, create, update, delete]
      users: [read, create, update, delete]
      settings: [read]
    settings_sections: [notifications, personalization, users]
  user:
    permissions:
      templates: [read, create, update]
      submissions: [read, create, update]
      users: []
      settings: []
    settings_sections: []
