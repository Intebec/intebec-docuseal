name: Build and Deploy

on:
  push:
    branches:
      - release

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Vérifications avant mise en ligne. Rien ne part en déploiement si ce job
  # échoue — `deploy` en dépend explicitement (`needs: verify`).
  # ────────────────────────────────────────────────────────────────────────
  verify:
    runs-on: [self-hosted, docker]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips42t64 liblept5 build-essential

      # Build matching the runner: the self-hosted runner is arm64, GitHub's are x64.
      - name: Install pdfium
        env:
          PDFIUM_BASE: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8035
          PDFIUM_SHA256_X64: 2e6db042dd2cff2d5247023dbec6c7ebb800042ce83c835d6468d45229669bd4
          PDFIUM_SHA256_ARM64: 10bb7728a5268593a31c2024e0e57ea26b73b7a54195054f43d2ad0869d55a48
        run: |
          set -e
          case "${{ runner.arch }}" in
            X64) PDFIUM_ARCH=x64; PDFIUM_SHA256=$PDFIUM_SHA256_X64 ;;
            ARM64) PDFIUM_ARCH=arm64; PDFIUM_SHA256=$PDFIUM_SHA256_ARM64 ;;
            *) echo "::error::Unsupported runner arch ${{ runner.arch }}"; exit 1 ;;
          esac
          curl -fsSL -o pdfium.tgz "$PDFIUM_BASE/pdfium-linux-$PDFIUM_ARCH.tgz"
          echo "$PDFIUM_SHA256  pdfium.tgz" | sha256sum -c -
          mkdir -p pdfium-extracted
          tar xzf pdfium.tgz -C pdfium-extracted lib/libpdfium.so
          sudo install -m 0644 pdfium-extracted/lib/libpdfium.so /usr/lib/libpdfium.so
          sudo ldconfig

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
          bundler-cache: true

      # Node then Yarn first: the self-hosted runner has neither preinstalled, and
      # setup-node's yarn cache needs `yarn` already on the PATH.
      - name: Setup Node (for Yarn)
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Yarn
        run: command -v yarn >/dev/null || npm install -g yarn@1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Rubocop
        run: bundle exec rubocop

      - name: Brakeman
        run: bundle exec brakeman -q

      - name: Prepare database
        run: bundle exec rails db:prepare

      - name: RSpec
        run: bundle exec rspec

  # ────────────────────────────────────────────────────────────────────────
  # Le déploiement en tant que tel se passe ailleurs, sur une infrastructure
  # qui n'est pas documentée dans ce dépôt public. Ce job se contente de
  # déclencher ce processus via un webhook signé — aucune commande de build
  # ni d'accès SSH ici.
  #
  # Tourne sur des runners auto-hébergés déjà positionnés pour atteindre la
  # cible interne ; l'appel reste signé (HMAC SHA-256) pour que la cible
  # puisse le vérifier.
  # ────────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: [self-hosted, docker]
    needs: verify

    steps:
      - name: Trigger deployment
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_ENDPOINT_BASE: ${{ vars.DEPLOY_ENDPOINT_BASE }}
          DEPLOY_TARGET_ID: ${{ vars.DEPLOY_TARGET_ID }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -e

          BODY="{\"ref\":\"${GIT_REF}\"}"

          SIGNATURE=$(printf '%s' "$BODY" |
            openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" |
            awk '{print $2}')

          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            --data "$BODY" \
            "${DEPLOY_ENDPOINT_BASE%/}/${DEPLOY_TARGET_ID}"

          echo "Deployment triggered."
