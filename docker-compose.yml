services:
  app:
    build: .
    image: intebec/docuseal:latest
    ports:
      - 3000:3000
    volumes:
      - ./docuseal:/data/docuseal
      # Prod needs ONE config. Point INTEBEC_CONFIG_FILE at the client to deploy,
      # e.g. INTEBEC_CONFIG_FILE=../intebec-whitelabel/clients/parcours.yml.
      # Both vars are kept in sync in .env by intebec-whitelabel/bin/use-client.
      - ${INTEBEC_CONFIG_FILE:-./config/config.yml}:/run/secrets/config.yml:ro
      # Per-client brand images (logo/favicons). The config's asset paths point
      # at /brands/<client>/..., served from here. Folder is gitignored, so it
      # is mounted rather than baked into the image.
      - ${INTEBEC_BRAND_DIR:-./public/brands}:/app/public/brands:ro
    environment:
      - FORCE_SSL=${FORCE_SSL:-false}
      # File mode: mount a config (see volumes above).
      # API mode:  remove the volume mount and set INTEBEC_LICENCE_KEY + INTEBEC_SECRET_KEY.
      - INTEBEC_CONFIG_PATH=/run/secrets/config.yml
      - INTEBEC_LICENCE_KEY=${INTEBEC_LICENCE_KEY:-}
      - INTEBEC_SECRET_KEY=${INTEBEC_SECRET_KEY:-}
